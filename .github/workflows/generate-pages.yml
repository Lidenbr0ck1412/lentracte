name: Générer les pages statiques des reviews

on:
  # Se déclenche tous les jours à 6h du matin (heure UTC) —
  # ajuste l'heure si tu préfères, ou ajoute d'autres triggers.
  schedule:
    - cron: '0 6 * * *'
  # Permet aussi de le lancer manuellement depuis l'onglet "Actions" sur GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer les pages
        run: node generate-static-pages.js

      - name: Commit et push si des fichiers ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*-critique/*' '*-comment-c-est-fait/*' sitemap.xml
          git diff --staged --quiet || git commit -m "Régénération automatique des pages reviews"
          git push
